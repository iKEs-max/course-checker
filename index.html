<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Pre-Requisite Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">
    
    <div class="container mt-5">
        <h1 class="text-center mb-4">University Course Checker</h1>
        
        <div class="card bg-secondary p-4">
            
            <!-- Dropdown for Completed Courses -->
            <div class="mb-3">
                <label for="completedCourses" class="form-label">Select Courses You Have Completed:</label>
                <select multiple class="form-select bg-dark text-light border-secondary" id="completedCourses" size="4">
                    <option value="DCIT101">DCIT 101 - Intro to Computing</option>
                    <option value="DCIT103">DCIT 103 - Foundations of Programming</option>
                    <option value="MATH121">MATH 121 - Algebra & Trigonometry</option>
                    <option value="DCIT201">DCIT 201 - Data Structures & Algorithms</option>
                </select>
                <small class="text-light-50">Hold Ctrl (or Cmd on Mac) to select multiple.</small>
            </div>

            <!-- Dropdown for Target Course -->
            <div class="mb-3">
                <label for="targetCourse" class="form-label">Course You Want to Take:</label>
                <select class="form-select bg-dark text-light border-secondary" id="targetCourse">
                    <option value="DCIT201">DCIT 201 - Data Structures & Algorithms</option>
                    <option value="DCIT301">DCIT 301 - Operating Systems</option>
                </select>
            </div>

            <!-- Check Button -->
            <button id="checkBtn" class="btn btn-primary w-100">Check Eligibility</button>

            <!-- Result Display Area -->
            <div id="result" class="mt-4 text-center fw-bold fs-4"></div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
